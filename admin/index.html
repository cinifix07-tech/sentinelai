    <title>Sentinel AI Admin</title>

  <body>
    <div id="root"></div>
    <script>
      // Keep the browser console quiet from React's development-only reminder.
      (() => {
        const info = console.info.bind(console);
        console.info = (...args) => {
          if (String(args[0] || '').includes('Download the React DevTools')) return;
          info(...args);
        };
        window.setInterval(() => console.clear(), 100);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
